name: Build Yui Market APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    # Используем проверенный и быстрый сервер
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libbz2-dev libsqlite3-dev libssl-dev libgdbm-dev libgdbm-compat-dev liblzma-dev libffi-dev uuid-dev tar docutils reverse-depends
          pip install --upgrade pip
          # Строго фиксируем зависимости, чтобы Buildozer не спотыкался
          pip install "cython<3.0.0" virtualenv pillow requests Kivy==2.3.0 buildozer

      - name: Auto-Generate Fresh Configuration
        run: |
          # Вычищаем старые остатки
          rm -f buildozer.spec
          chmod -R 777 .
          
          # Генерируем новый конфиг с нуля
          buildozer init
          
          # --- СУВОРЫЕ НАСТРОЙКИ ПОД REALME GT 5G И АРТЫ ---
          sed -i 's/android.minapi = .*/android.minapi = 29/' buildozer.spec
          sed -i 's/android.api = .*/android.api = 33/' buildozer.spec
          sed -i 's/android.archs = .*/android.archs = arm64-v8a/' buildozer.spec
          
          # Зашиваем расширения файлов
          sed -i 's/source.include_exts = .*/source.include_exts = py,png,json/' buildozer.spec
          sed -i 's/requirements = .*/requirements = python3,kivy==2.3.0,pillow,requests/' buildozer.spec
          
          # Прописываем иконку и заставку
          sed -i 's/# icon.filename = .*/icon.filename = icon.png/' buildozer.spec
          sed -i 's/# presplash.filename = .*/presplash.filename = yui_splash.png/' buildozer.spec
          
          # Автоматически принимаем лицензии Google SDK
          sed -i 's/# android.accept_sdk_license = .*/android.accept_sdk_license = True/' buildozer.spec
          
          # Включаем логирование на максимум, чтобы видеть прогресс
          sed -i 's/log_level = .*/log_level = 2/' buildozer.spec

      - name: Build Clean APK via Raw Commands
        run: |
          # 🟢 ТУТ ВСЕ ИСПРАВЛЕНО: Никаких сторонних экшенов! 
          # Запускаем чистую сборку напрямую в Linux-окружении
          yes | buildozer android debug

      - name: Upload Clean Purple APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Yui-Commercial-Beta-APK
          path: bin/*.apk
          
