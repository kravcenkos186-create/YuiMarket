name: Build Yui Market APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Auto-Generate Fresh Configuration
        run: |
          # Полностью вычищаем старые конфиги и ставим права
          rm -f buildozer.spec
          chmod -R 777 .
          
          # Устанавливаем Buildozer для генерации чистого конфика
          pip install --user buildozer
          ~/.local/bin/buildozer init
          
          # --- НАСТРОЙКИ ПОД ТВОЙ REALME GT 5G И АРТЫ ---
          sed -i 's/android.minapi = .*/android.minapi = 29/' buildozer.spec
          sed -i 's/android.api = .*/android.api = 35/' buildozer.spec
          sed -i 's/android.archs = .*/android.archs = arm64-v8a/' buildozer.spec
          
          # Включаем картинки и json файлы внутрь APK
          sed -i 's/source.include_exts = .*/source.include_exts = py,png,json/' buildozer.spec
          
          # Добавляем зависимости Kivy и Python
          sed -i 's/requirements = .*/requirements = python3,kivy==2.3.0,pillow,requests/' buildozer.spec
          
          # Зашиваем твою иконку и заставку
          sed -i 's/# icon.filename = .*/icon.filename = icon.png/' buildozer.spec
          sed -i 's/# presplash.filename = .*/presplash.filename = yui_splash.png/' buildozer.spec

      - name: Set up Python 3.10
        uses: actions/checkout@v4
        
      - name: Build Clean APK via Working Buildozer Action
        # 🟢 ЗДЕСЬ ИСПРАВЛЕНО: Используем официальный рабочий Docker-билд, который точно найдет на серверах!
        uses: kivy/buildozer-action@v1
        with:
          command: 'android debug'

      - name: Upload Clean Purple APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Yui-Commercial-Beta-APK
          path: bin/*.apk
          
