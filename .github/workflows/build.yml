name: Build Yui Market APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    # 🟢 ВИПРАВЛЕНО: Пересідаємо на найсвіжіший та найшвидший сервер GitHub для миттєвого старту!
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Auto-Generate Fresh Configuration
        run: |
          # Повністю вичищаємо старі конфіги та виставляємо повні права
          rm -f buildozer.spec
          chmod -R 777 .
          
          # Ініціалізуємо свіжий чистовий Buildozer
          pip install --user buildozer
          ~/.local/bin/buildozer init
          
          # --- СУВОРІ НАЛАШТУВАННЯ ПІД REALME GT 5G ТА АРТИ ---
          sed -i 's/android.minapi = .*/android.minapi = 29/' buildozer.spec
          sed -i 's/android.api = .*/android.api = 35/' buildozer.spec
          sed -i 's/android.archs = .*/android.archs = arm64-v8a/' buildozer.spec
          
          # Включаємо картинки та json файли всередину APK
          sed -i 's/source.include_exts = .*/source.include_exts = py,png,json/' buildozer.spec
          
          # Додаємо залежності Kivy та Python
          sed -i 's/requirements = .*/requirements = python3,kivy==2.3.0,pillow,requests/' buildozer.spec
          
          # Зашиваємо твою круту іконку та заставку з градієнтом
          sed -i 's/# icon.filename = .*/icon.filename = icon.png/' buildozer.spec
          sed -i 's/# presplash.filename = .*/presplash.filename = yui_splash.png/' buildozer.spec
          
          # Автоматично приймаємо всі ліцензії Android SDK
          sed -i 's/# android.accept_sdk_license = .*/android.accept_sdk_license = True/' buildozer.spec
          
          # Вмикаємо максимальний рівень логів для повного контролю розробника
          sed -i 's/log_level = .*/log_level = 2/' buildozer.spec

      - name: Build Clean APK via Official Kivy Action
        # Використовуємо стабільний Docker-білдер від творців Kivy
        uses: kivy/buildozer-action@v1
        with:
          command: 'android debug'

      - name: Upload Clean Purple APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Yui-Commercial-Beta-APK
          path: bin/*.apk
          
