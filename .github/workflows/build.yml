name: Build Yui APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Install Java and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk \
            build-essential python3-pip python3-venv \
            libffi-dev libssl-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.36

      - name: Unpack Yui
        run: |
          mkdir project
          unzip YuiMarket.zip -d project

      - name: Build APK
        working-directory: project
        run: buildozer -v android debug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Yui-AI-APK
          path: project/bin/*.apk
