name: Build Yui Market APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK components
        run: |
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "$ANDROID_HOME/build-tools/34.0.0" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git zip unzip \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer "Cython<3"

      - name: Build Android debug APK
        run: |
          set +e
          yes | buildozer -v android debug 2>&1 | tee build.log
          statuses=( "${PIPESTATUS[@]}" )
          status=${statuses[1]}
          echo "---- КОРОТКИЙ ЗВІТ ПРО ПОМИЛКИ ----"
          grep -n -B 8 -A 12 -E 'ERROR:|Error:|error:|FAILED|Failed' build.log | tail -n 160 || true
          exit "$status"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Yui-Android-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14
