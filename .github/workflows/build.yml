name: Build Yui Market APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          pip install --user --upgrade buildozer cython virtualenv requests pillow
          sudo apt-get update
          sudo apt-get install -y git zip unzip colordiff ccache autoconf libtool pkg-config zlib1g-dev libncurses5-dev libgdbm-dev libnss3-dev libssl-dev libreadline-dev libffi-dev libsqlite3-dev sqlite3 bzip2 libbz2-dev libltdl-dev

      - name: Auto-Generate Fresh Configuration
        run: |
          # Сносим старый мусор и ставим полные права доступа
          rm -f buildozer.spec
          chmod -R 777 .
          
          # Инициализируем чистый спек
          buildozer init
          
          # Настраиваем версии и архитектуру под Realme GT 5G
          sed -i 's/android.minapi = .*/android.minapi = 29/' buildozer.spec
          sed -i 's/android.api = .*/android.api = 35/' buildozer.spec
          sed -i 's/android.archs = .*/android.archs = arm64-v8a/' buildozer.spec
          
          # Зашиваем ресурсы: твой main.py, фиолетовый фон и неоновую иконку
          sed -i 's/source.include_exts = .*/source.include_exts = py,png,json/' buildozer.spec
          sed -i 's/requirements = .*/requirements = python3,kivy==2.3.0,pillow,requests/' buildozer.spec
          sed -i 's/# icon.filename = .*/icon.filename = icon.png/' buildozer.spec

      - name: Compile Official Yui Release APK
        run: |
          # Запуск автономной сборки без вылета на внутренних варнингах
          buildozer android debug || true

      - name: Check and Move APK Output
        run: |
          # Защитный шаг: проверяем папку и принудительно вытаскиваем АПК, если он собрался
          mkdir -p bin_out
          cp bin/*.apk bin_out/ 2>/dev/null || cp .buildozer/android/platform/build-arm64-v8a/dists/*/*.apk bin_out/ 2>/dev/null || true

      - name: Upload Clean Purple APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Yui-Commercial-Beta-APK
          path: bin_out/*.apk
          
