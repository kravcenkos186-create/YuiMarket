name: Build Yui APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    # 22.04 стабільніший для python-for-android, ніж ubuntu-latest (24.04)
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Android SDK/NDK (прискорює повторні збірки)
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config \
            build-essential ccache cmake zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo5 libffi-dev libssl-dev libltdl-dev

      - name: Install Python tools
        run: |
          python -m pip install --upgrade pip wheel setuptools
          pip install "cython==0.29.36" virtualenv buildozer==1.5.0

      - name: Build APK
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log

      - name: Show the real error (only if the build failed)
        if: failure()
        run: |
          grep -n -i -E "error|failed|traceback|no such file|not found" build.log | grep -v -i "warning" | tail -60

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Yui-build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Yui-APK
          path: bin/*.apk
