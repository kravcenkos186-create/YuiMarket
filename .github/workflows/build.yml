name: Build Yui Market APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android Licenses Automatically
        run: |
          yes | sdkmanager --licenses || true

      - name: Install Build Tools
        run: |
          yes | sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Buildozer and Dependencies
        run: |
          pip install --user --upgrade buildozer cython virtualenv
          sudo apt-get update
          sudo apt-get install -y git zip unzip colordiff ccache autoconf libtool pkg-config zlib1g-dev libncurses5-dev libgdbm-dev libnss3-dev libssl-dev libreadline-dev libffi-dev libsqlite3-dev sqlite3 bzip2 libbz2-dev

      - name: Force Android 10 to Newest API Support
        run: |
          # Створюємо та жорстко налаштовуємо buildozer.spec під твій Realme
          if [ ! -f buildozer.spec ]; then buildozer init; fi
          sed -i 's/android.minapi = .*/android.minapi = 29/' buildozer.spec
          sed -i 's/android.api = .*/android.api = 35/' buildozer.spec
          sed -i 's/android.archs = .*/android.archs = arm64-v8a/' buildozer.spec
          sed -i 's/source.include_exts = .*/source.include_exts = py,png,json/' buildozer.spec
          sed -i 's/requirements = .*/requirements = python3,kivy,pillow,requests/' buildozer.spec

      - name: Build Clean Android 10+ APK
        run: |
          buildozer android debug
        continue-on-error: true

      - name: Upload Working APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Yui-Commercial-Beta-APK
          path: bin/*.apk
          
