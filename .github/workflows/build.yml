name: Build Yui Market APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libbz2-dev libsqlite3-dev libssl-dev libgdbm-dev libgdbm-compat-dev liblzma-dev libffi-dev uuid-dev tar docutils reverse-depends
          # Додаткові залежності для Kivy/Клієнта
          pip install --upgrade pip
          pip install cython virtualenv pillow requests kivy==2.3.0 buildozer

      - name: Auto-Generate Fresh Configuration
        run: |
          # Вичищаємо старі файли та ставимо повні права
          rm -f buildozer.spec
          chmod -R 777 .
          
          # Ініціалізуємо свіжий Buildozer
          buildozer init
          
          # --- СУВOРІ НАЛAШТУВАННЯ ПІД REALME GT 5G ТА АРТИ ---
          sed -i 's/android.minapi = .*/android.minapi = 29/' buildozer.spec
          sed -i 's/android.api = .*/android.api = 33/' buildozer.spec
          sed -i 's/android.archs = .*/android.archs = arm64-v8a/' buildozer.spec
          sed -i 's/source.include_exts = .*/source.include_exts = py,png,json/' buildozer.spec
          sed -i 's/requirements = .*/requirements = python3,kivy==2.3.0,pillow,requests/' buildozer.spec
          
          # Примусово прописуємо іконку та заставку
          sed -i 's/# icon.filename = .*/icon.filename = icon.png/' buildozer.spec
          sed -i 's/# presplash.filename = .*/presplash.filename = yui_splash.png/' buildozer.spec
          
          # Погоджуємося з ліцензіями автоматично, щоб SDK не падав
          sed -i 's/# android.accept_sdk_license = .*/android.accept_sdk_license = True/' buildozer.spec

      - name: Build Clean Purple APK via Raw Buildozer
        run: |
          # Запускаємо чисту збірку в обхід багнутих екшенів
          yes | buildozer android debug

      - name: Upload Clean Purple APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Yui-Commercial-Beta-APK
          path: bin/*.apk
          
